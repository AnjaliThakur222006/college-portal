{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>College Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:500px;
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    color:#0d47a1;
    margin-bottom:20px;
    font-size:34px;
}

p{
    color:#555;
    font-size:18px;
    margin-bottom:30px;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:8px;
    background:#0d47a1;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1565c0;
    transform:scale(1.05);
}

</style>

</head>

<body>

<div class="container">

    <h1> Welcome to Django</h1>

    <p>
        This is my first Django application.
    </p>

    <button>
        Explore Django
    </button>

</div>

</body>
</html>
