<!DOCTYPE html>
<html>
<head>
    <title>About</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#eef3ff;
            padding-top:70px;
            padding-bottom:70px;
        }

        /* Header */

        nav{
            background:#0d6efd;
            padding:15px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            z-index:1000;
        }

        nav h2{
            color:white;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:20px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        nav ul li a:hover{
            color:yellow;
        }

        /* About Section */

        .container{
            width:70%;
            margin:60px auto;
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 15px gray;
            text-align:center;
        }

        h1{
            color:#0d6efd;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
            line-height:35px;
            color:#444;
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            background:#0d6efd;
            color:white;
            padding:12px 25px;
            text-decoration:none;
            border-radius:25px;
            font-weight:bold;
        }

        .btn:hover{
            background:#0047b3;
        }

        /* Footer */

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:20px;
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
        }

    </style>

</head>

<body>

    <nav>

        <h2>Django App</h2>

        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>

    </nav>

    <div class="container">

        <h1>About Us</h1>

        <p>
            This website is developed using <b>HTML, CSS, Python and Django</b>.
        </p>

        <p>
            It is a beginner project to learn Django Templates, URL Routing and Views.
        </p>

        <a href="{% url 'home' %}" class="btn">Back to Home</a>

    </div>

    <footer>
        <h3>© 2026 Django Project | Made by Anjali</h3>
    </footer>

</body>
</html>
