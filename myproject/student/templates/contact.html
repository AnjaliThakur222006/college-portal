<!DOCTYPE html>
<html>

<head>

    <title>Contact</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#fffdf2;
            padding-top:80px;
            padding-bottom:80px;
        }

        /* Navbar */

        nav{

            background:#f7d774;
            padding:15px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            position:fixed;
            top:0;
            width:100%;
            box-shadow:0 3px 10px rgba(0,0,0,.15);

        }

        nav h2{

            color:#5d4037;

        }

        nav ul{

            display:flex;
            list-style:none;

        }

        nav ul li{

            margin-left:25px;

        }

        nav ul li a{

            color:#5d4037;
            text-decoration:none;
            font-weight:bold;
            transition:.3s;

        }

        nav ul li a:hover{

            color:#d97706;

        }

        /* Contact Box */

        .container{

            width:450px;
            margin:40px auto;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.15);

        }

        h1{

            text-align:center;
            color:#c48a00;
            margin-bottom:25px;

        }

        input,
        textarea{

            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #e0c96d;
            border-radius:8px;
            font-size:15px;

        }

        input:focus,
        textarea:focus{

            outline:none;
            border-color:#d4a017;

        }

        button{

            width:100%;
            padding:12px;
            background:#f7d774;
            color:#5d4037;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
            font-weight:bold;

        }

        button:hover{

            background:#f2c94c;

        }

        .back{

            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            color:#c48a00;
            font-weight:bold;

        }

        footer{

            background:#5d4037;
            color:white;
            text-align:center;
            padding:18px;
            position:fixed;
            bottom:0;
            width:100%;

        }

    </style>

</head>

<body>

<nav>

    <h2>JG University</h2>

    <ul>

        <li><a href="{% url 'home' %}">Home</a></li>

        <li><a href="{% url 'about' %}">About</a></li>

        <li><a href="{% url 'student' %}">Student</a></li>

        <li><a href="{% url 'course' %}">Course</a></li>

        <li><a href="{% url 'contact' %}">Contact</a></li>

    </ul>

</nav>

<div class="container">

    <h1>Contact Us</h1>

    <form>

        <input type="text" placeholder="Enter Your Name">

        <input type="email" placeholder="Enter Your Email">

        <textarea rows="5" placeholder="Enter Your Message"></textarea>

        <button type="submit">

            Send Message

        </button>

    </form>

    <a href="{% url 'home' %}" class="back">

        ← Back to Home

    </a>

</div>

<footer>

    <h3>© 2026 JG University | Made by Anjali</h3>

</footer>

</body>

</html>
