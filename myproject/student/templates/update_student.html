<!DOCTYPE html>
<html>

<head>

<title>Update Student</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    background:#fffdf2;
    padding-top:50px;

}


/* Container */

.container{

    width:450px;
    margin:50px auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);

}



h1{

    text-align:center;
    color:#c48a00;
    margin-bottom:30px;

}


/* Form */

label{

    display:block;
    margin-top:15px;
    color:#5d4037;
    font-weight:bold;

}



input{

    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #e0c96d;
    border-radius:8px;
    font-size:15px;

}



input:focus{

    outline:none;
    border-color:#d4a017;

}


/* Button */

button{

    width:100%;
    margin-top:25px;
    padding:12px;
    background:#f7d774;
    color:#5d4037;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;

}


button:hover{

    background:#f2c94c;

}


/* Back Button */

.back{

    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#c48a00;
    font-weight:bold;

}



</style>

</head>


<body>


<div class="container">


<h1>
    Update Student
</h1>



<form method="POST">


{% csrf_token %}



<label>
First Name
</label>


<input type="text" 
name="first_name"
value="{{student.first_name}}">





<label>
Last Name
</label>


<input type="text"
name="last_name"
value="{{student.last_name}}">





<label>
Email
</label>


<input type="email"
name="email"
value="{{student.email}}">





<label>
Enrollment Date
</label>


<input type="date"
name="enrollment_date"
value="{{student.enrollment_date|date:'Y-m-d'}}">





<button type="submit">

Update Student

</button>


</form>



<a href="{% url 'student' %}" class="back">

← Back to Student List

</a>



</div>



</body>

</html>
