<!DOCTYPE html>
<html>
<head>

<title>Course Details</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    background:#fffbea;
    padding:30px;

}


/* Main Container */

.container{

    width:90%;
    margin:auto;
    background:#fffdf5;
    padding:25px;
    border-radius:12px;

    box-shadow:0px 5px 15px rgba(244,196,48,0.3);

}



/* Heading */

h1{

    text-align:center;
    color:#b8860b;
    margin-bottom:25px;

}



/* Table */

table{

    width:100%;
    border-collapse:collapse;

}



th{

    background:#f4c430;
    color:#333;
    padding:15px;

}



td{

    padding:12px;
    text-align:center;
    border-bottom:1px solid #e5d27a;

}



tr:hover{

    background:#fff3b0;

}



tr:nth-child(even){

    background:#fff9d6;

}



/* No Data */

.no-data{

    color:#dc3545;
    font-weight:bold;
    padding:20px;

}



/* Buttons */


.btn{

    display:inline-block;
    padding:10px 18px;

    background:#d4a017;

    color:white;

    text-decoration:none;

    border-radius:6px;

    margin-bottom:20px;

    font-weight:bold;

}



.btn:hover{

    background:#b8860b;

}




/* Edit Button */


.edit{

    background:#198754;

}



.edit:hover{

    background:#146c43;

}




/* Delete Button */


.delete{

    background:#dc3545;

}



.delete:hover{

    background:#bb2d3b;

}



</style>


</head>


<body>



<div class="container">



<h1>
    Course Details
</h1>



<!-- Add Button -->


<a href="/add_course/" class="btn">

+ Add Course

</a>




<table border="1">



<tr>

<th>ID</th>

<th>Course Name</th>

<th>Description</th>

<th>Start Date</th>

<th>End Date</th>

<th>Action</th>

</tr>




{% for course in courses %}



<tr>



<td>

{{ course.id }}

</td>



<td>

{{ course.name }}

</td>



<td>

{{ course.description }}

</td>



<td>

{{ course.start_date }}

</td>



<td>

{{ course.end_date }}

</td>



<td>



<a href="/update_course/{{course.id}}/" class="btn edit">

Edit

</a>




<a href="/delete_course/{{course.id}}/" 
class="btn delete"
onclick="return confirm('Are you sure?')">

Delete

</a>



</td>



</tr>




{% empty %}



<tr>

<td colspan="6" class="no-data">

No Course Data Found

</td>

</tr>



{% endfor %}




</table>



</div>



</body>

</html>
