<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff8dc;
            padding-top: 70px;
            padding-bottom: 70px;
        }

        /* Header */

        nav {
            background: #ffc107;
            padding: 15px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
        }

        nav h2 {
            color: #333;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: red;
        }

        /* Form */

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            text-align: center;
            color: #ff9800;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 15px;
            color: #444;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ffc107;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff9800;
            color: white;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #ff9800;
            font-weight: bold;
        }

        /* Footer */

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }
    </style>

</head>

<body>

    <nav>

        <h2>Django App</h2>

        <ul>

            <li><a href="{% url 'home' %}">Home</a></li>

            <li><a href="{% url 'student' %}">Students</a></li>

            <li><a href="{% url 'course' %}">Course</a></li>

        </ul>

    </nav>

    <div class="container">

        <h1>Add Student</h1>

        <!-- Django Form -->

        <form method="POST">

            {% csrf_token %}

            <h2>Student Information</h2>

            {{ form.as_p }}

            <button type="submit">
                Add Student
            </button>

        </form>

        <!--
        ===========================
        Normal HTML Form (Commented)
        ===========================

        <form method="POST">

            {% csrf_token %}

            <label>First Name</label>
            <input type="text" name="first_name" placeholder="Enter First Name">

            <label>Last Name</label>
            <input type="text" name="last_name" placeholder="Enter Last Name">

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter Email">

            <label>Enrollment Date</label>
            <input type="date" name="enrollment_date">

            <button type="submit">
                Add Student
            </button>

        </form>

        -->

        <a href="{% url 'student' %}" class="back">
            Back to Student List
        </a>

    </div>

    <footer>

        <h3>
            © 2026 Django Project | Made by Anjali
        </h3>

    </footer>

</body>

</html>
